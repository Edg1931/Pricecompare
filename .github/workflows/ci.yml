name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # postinstall runs `prisma generate` which only reads schema.prisma
      # — no DB connection needed.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Catch build breakage before it reaches Vercel. Skips migrate deploy
      # (no DB in CI) — plain `next build` after generate.
      - run: npx next build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
